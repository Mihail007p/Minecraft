/* NITRO RUSH — root build file.
   The game itself is a single offline HTML file in app/src/main/assets;
   this project only wraps it in a WebView shell. */
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
