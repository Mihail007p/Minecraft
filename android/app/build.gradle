apply plugin: 'com.android.application'

def keystoreFile = rootProject.file('keystore.jks')
def hasKeystore = keystoreFile.exists()

android {
    namespace 'com.nitrorush.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.nitrorush.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'nitrorush'
                keyAlias System.getenv('KEY_ALIAS') ?: 'nitrorush'
                keyPassword System.getenv('KEY_PASSWORD') ?: 'nitrorush'
            }
        }
    }

    buildTypes {
        debug {
            /* debug builds are signed with the standard debug key */
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }

    androidResources {
        noCompress 'html'
    }
}

/* Rebuilds the single-file game into assets/ before packaging.
   If node is unavailable the previous asset (if any) is used as-is. */
tasks.register('buildOfflineBundle', Exec) {
    description 'Builds dist/NITRO RUSH.html and copies it into the assets folder'
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'tools/build-offline.js', '--android'
    ignoreExitValue true
}

tasks.matching { it.name.startsWith('preBuild') }.configureEach {
    dependsOn 'buildOfflineBundle'
}
