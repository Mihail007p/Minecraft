name: Build NITRO RUSH APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'race/**'
      - 'android/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'race/**'
      - 'android/**'
      - 'tools/**'

permissions:
  contents: write

jobs:
  test:
    name: Tests (simulation, scene, UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependency (jsdom)
        run: |
          mkdir -p /tmp/uidep
          npm install --prefix /tmp/uidep jsdom --no-audit --no-fund

      - name: Simulation & physics tests
        run: node tools/test-sim.js

      - name: Scene integrity tests
        run: node tools/test-scene.js

      - name: Build the offline single-file game
        run: node tools/build-offline.js

      - name: UI & bundle integration tests
        run: node tools/test-ui.js

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the offline single-file game into the APK assets
        run: node tools/build-offline.js --android

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create a signing key (so the release APK is installable)
        working-directory: android
        run: |
          keytool -genkeypair -v -keystore keystore.jks \
            -alias nitrorush -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nitrorush -keypass nitrorush \
            -dname "CN=NITRO RUSH, OU=Games, O=NitroRush, L=Moscow, C=RU"

      - name: Assemble debug and release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Show what was built
        run: find android/app/build/outputs -name "*.apk" -exec ls -la {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nitro-rush-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the offline HTML build
        uses: actions/upload-artifact@v4
        with:
          name: nitro-rush-html
          path: dist/*.html
          if-no-files-found: error

      - name: Attach APKs to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
