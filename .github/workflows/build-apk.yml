name: Build NITRO RUSH APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*', 'nitro-rush-*']
    paths:
      - 'race/**'
      - 'android/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'race/**'
      - 'android/**'
      - 'tools/**'

permissions:
  contents: write

jobs:
  test:
    name: Tests (simulation, scene, UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install test dependency (jsdom)
        run: |
          mkdir -p /tmp/uidep
          npm install --prefix /tmp/uidep jsdom --no-audit --no-fund

      - name: Simulation & physics tests
        run: node tools/test-sim.js

      - name: Scene integrity tests
        run: node tools/test-scene.js

      - name: Build the offline single-file game
        run: node tools/build-offline.js

      - name: UI & bundle integration tests
        run: node tools/test-ui.js

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build the offline single-file game into the APK assets
        run: node tools/build-offline.js --android

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.7'

      - name: Create a signing key (so the release APK is installable)
        working-directory: android
        run: |
          keytool -genkeypair -v -keystore keystore.jks \
            -alias nitrorush -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nitrorush -keypass nitrorush \
            -dname "CN=NITRO RUSH, OU=Games, O=NitroRush, L=Moscow, C=RU"

      - name: Assemble debug and release APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Show what was built
        run: find android/app/build/outputs -name "*.apk" -exec ls -la {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: nitro-rush-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Give the offline build a download-friendly name
        run: cp "dist/NITRO RUSH.html" dist/nitro-rush.html

      - name: Upload the offline HTML build
        uses: actions/upload-artifact@v5
        with:
          name: nitro-rush-html
          path: dist/nitro-rush.html
          if-no-files-found: error

      - name: Attach APKs to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 'NITRO RUSH — гонки (сборка ${{ github.ref_name }})'
          body: |
            Готовый APK для Android 14 и офлайн-версия игры одним файлом.

            **Установка APK**
            1. Скачайте `app-release.apk` (или `app-debug.apk`).
            2. Откройте файл на телефоне → разрешите установку из неизвестных источников.
            3. Запустите «NITRO RUSH» — интернет не нужен, игра работает офлайн.

            `nitrorush.html` — та же игра одним файлом: открывается в Chrome
            прямо с телефона, без установки.

            Управление: наклон или кнопки ‹ › для поворота, газ автоматический,
            кнопка дрифта — занос и заряд нитро, кнопка нитро — ускорение.
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            dist/nitro-rush.html
          generate_release_notes: true
