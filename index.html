<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игры в репозитории</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#1a1030,#05060a 70%);
    color:#eef1f6;font-family:'Roboto',Arial,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .wrap{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;padding:24px}
  a.card{display:block;width:min(78vw,340px);padding:26px;border-radius:22px;text-decoration:none;color:inherit;
    background:rgba(18,18,26,.86);border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.5);
    transition:transform .12s,border-color .2s}
  a.card:hover{transform:translateY(-4px);border-color:#2fd0ff}
  h1{margin:0 0 8px;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
  h1 span{color:#ff2f6d}
  p{margin:6px 0;color:#98a0b0;font-size:14px;line-height:1.5}
  .tag{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;
    background:rgba(47,208,255,.16);border:1px solid rgba(47,208,255,.5)}
</style>
</head>
<body>
  <div class="wrap">
    <a class="card" href="race/index.html">
      <h1>NITRO <span>RUSH</span></h1>
      <p>Уличные гонки: карьера, дрифт, нитро, тюнинг. 6 трасс, 12 машин.
         Полностью офлайн — можно установить APK на Android.</p>
      <div class="tag">Играть →</div>
    </a>
    <a class="card" href="game/index.html">
      <h1>MINE<span>CRAFT</span></h1>
      <p>Небольшой воксельный мир в браузере: ходить, ломать и ставить блоки.</p>
      <div class="tag">Играть →</div>
    </a>
  </div>
</body>
</html>
